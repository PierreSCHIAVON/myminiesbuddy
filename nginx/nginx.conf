events {
  worker_connections 1024;
}

http {
  # Compression gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Limite la taille des uploads
  client_max_body_size 10M;

  # Cache pour les assets statiques Next.js
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextjs_cache:10m max_size=1g inactive=60m;

  upstream nextjs_app {
    server app:3000;
  }

  # Redirige HTTP → HTTPS
  server {
    listen 80;
    server_name warforge.tools www.warforge.tools;
    return 301 https://$host$request_uri;
  }

  # Serveur HTTPS principal
  server {
    listen 443 ssl;
    server_name warforge.tools www.warforge.tools;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Headers de sécurité
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Assets statiques Next.js — mis en cache longtemps
    location /_next/static/ {
      proxy_pass http://nextjs_app;
      proxy_cache nextjs_cache;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tout le reste → Next.js
    location / {
      proxy_pass http://nextjs_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
